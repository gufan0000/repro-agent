name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  generated:
    name: generated files are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # protocol/** and spec/** are the source of truth; the embedded copies must match.
      - name: protocol and schema artifacts
        run: npm run generate -- --check
      # `npm run check` regenerates nothing and fails on any stale artifact, so it is the
      # same gate a developer gets locally. The belt-and-braces `git diff` stays: it catches
      # an artifact that gains a writer but never gains a --check.
      - name: nothing generated is stale
        run: npm run check
      - name: and nothing in the tree moved
        run: |
          npm run build
          git diff --exit-code || {
            echo "::error::generated files are stale — run 'npm run build' and commit the result"
            exit 1
          }

  browser:
    # The offline page is the artifact a non-technical person actually opens. Asserting on
    # its source text is not enough: the maintainer defaults that never reached the builder,
    # and the project fields a user could overwrite, both passed a green string-matching
    # suite. One real browser, one OS — enough to catch that class of bug.
    name: the offline page works in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  dogfood:
    name: our own profile is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/index.js validate .repro/project.json
      - run: node dist/index.js validate examples/*/project.json
      - name: end-to-end kit build
        run: |
          node dist/index.js build --profile .repro/project.json --out /tmp/kit
          test -f /tmp/kit/repro-agent-cli-support.html
          node dist/index.js task --profile .repro/project.json --summary "smoke test" -o /tmp/task.md
          node dist/index.js validate /tmp/task.md
