name: Temporary broky V2 footage fetch

on:
  pull_request:
    branches: [main]
    paths:
      - 'temp/broky_v2_trigger.txt'

permissions:
  contents: read

jobs:
  fetch-reddit-footage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q requests
      - name: Fetch Reddit native videos
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/raw out/final
          cat > /tmp/reddit_fetch.py <<'PY'
          import json, subprocess
          from pathlib import Path
          import requests

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36 broky-edit/1.0'
          S=requests.Session(); S.headers.update({'User-Agent':UA})
          OUT=Path('out'); (OUT/'raw').mkdir(parents=True,exist_ok=True); (OUT/'final').mkdir(parents=True,exist_ok=True)
          posts=[
            ('01_katowice22_broky_1v2','t2w54n'),
            ('02_broky_1v4_ace_2022','wzx120'),
            ('03_broky_g2_1v4_repost','1u8j9p7'),
          ]
          report=[]
          def find_video(d):
            candidates=[d]
            candidates += d.get('crosspost_parent_list') or []
            for x in candidates:
              for key in ('secure_media','media'):
                m=x.get(key) or {}
                rv=m.get('reddit_video') or {}
                if rv.get('fallback_url'):
                  return rv.get('fallback_url'),rv
              pv=x.get('preview') or {}
              rv=pv.get('reddit_video_preview') or {}
              if rv.get('fallback_url'):
                return rv.get('fallback_url'),rv
            return None,None
          for name,pid in posts:
            item={'name':name,'id':pid}
            try:
              urls=[f'https://www.reddit.com/comments/{pid}.json?raw_json=1',f'https://old.reddit.com/comments/{pid}.json?raw_json=1']
              obj=None
              for u in urls:
                r=S.get(u,timeout=30,headers={'User-Agent':UA,'Accept':'application/json'})
                item.setdefault('http',[]).append([u,r.status_code,r.text[:120]])
                if r.ok:
                  try: obj=r.json(); break
                  except Exception: pass
              if obj is None: raise RuntimeError('reddit json unavailable')
              d=obj[0]['data']['children'][0]['data']
              item.update({'title':d.get('title'),'permalink':d.get('permalink'),'dest':d.get('url_overridden_by_dest') or d.get('url')})
              url,rv=find_video(d)
              if not url: raise RuntimeError('no native reddit video; dest='+str(item.get('dest')))
              url=url.replace('&amp;','&')
              item['video_url']=url; item['reddit_video']=rv
              raw=OUT/'raw'/f'{name}.mp4'
              rr=S.get(url,stream=True,timeout=120,headers={'User-Agent':UA,'Referer':'https://www.reddit.com/'})
              rr.raise_for_status()
              with raw.open('wb') as f:
                for chunk in rr.iter_content(1024*1024):
                  if chunk: f.write(chunk)
              final=OUT/'final'/f'{name}.mp4'
              subprocess.run(['ffmpeg','-y','-loglevel','warning','-i',str(raw),'-vf','scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30','-an','-c:v','libx264','-preset','fast','-crf','19','-movflags','+faststart',str(final)],check=True)
              item['downloaded']=raw.stat().st_size; item['final']=final.stat().st_size
            except Exception as e:
              item['error']=repr(e)
            report.append(item)
          (OUT/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/reddit_fetch.py
          find out/final -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee out/files.txt
          cat out/report.json
          : > out/ffprobe.tsv
          for f in out/final/*.mp4; do
            [ -f "$f" ] || continue
            printf '%s\t' "$(basename "$f")" >> out/ffprobe.tsv
            ffprobe -v error -show_entries format=duration,size -of default=nw=1:nk=1 "$f" | tr '\n' '\t' >> out/ffprobe.tsv
            printf '\n' >> out/ffprobe.tsv
          done
      - name: Upload footage artifact
        uses: actions/upload-artifact@v4
        with:
          name: broky-v2-reddit-footage
          path: out
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
