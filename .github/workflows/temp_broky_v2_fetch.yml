name: Temporary broky V2 footage fetch

on:
  pull_request:
    branches: [main]
    paths:
      - 'temp/broky_v2_trigger.txt'

permissions:
  contents: read

jobs:
  fetch-youtube-footage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install media and PO-token tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade yt-dlp bgutil-ytdlp-pot-provider
          docker run -d --rm --name bgutil-provider -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          yt-dlp --version

      - name: Fetch precise public match excerpts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/raw out/final
          : > out/download.log

          ytdl_section() {
            local name="$1" url="$2" section="$3"
            echo "===== $name :: $url :: $section =====" | tee -a out/download.log
            yt-dlp \
              --no-warnings --ignore-errors --no-playlist \
              --remote-components ejs:github \
              --extractor-args "youtube:player_client=mweb,web_embedded" \
              --download-sections "$section" \
              --force-keyframes-at-cuts \
              --format "bv*[height<=720]+ba/b[height<=720]/b" \
              --merge-output-format mp4 \
              --output "out/raw/${name}.%(ext)s" \
              "$url" 2>&1 | tee -a out/download.log || true
          }

          ytdl_whole() {
            local name="$1" url="$2"
            echo "===== $name :: $url =====" | tee -a out/download.log
            yt-dlp \
              --no-warnings --ignore-errors --no-playlist \
              --remote-components ejs:github \
              --extractor-args "youtube:player_client=mweb,web_embedded" \
              --format "bv*[height<=720]+ba/b[height<=720]/b" \
              --merge-output-format mp4 \
              --output "out/raw/${name}.%(ext)s" \
              "$url" 2>&1 | tee -a out/download.log || true
          }

          # IEM Katowice 2022 grand final: broky multi-kills on Inferno and the iconic 4-AWP round on Dust2.
          ytdl_section "01_kato22_inferno_broky_3k" "https://www.youtube.com/watch?v=bucux7fBcgE" "*00:48:45-00:50:25"
          ytdl_section "02_kato22_dust2_broky_4awp" "https://www.youtube.com/watch?v=jUe-NSgmAgQ" "*00:49:05-00:50:50"

          # IEM Chengdu 2024: dedicated broky MVP highlight video.
          ytdl_whole "03_chengdu24_broky_mvp" "https://www.youtube.com/watch?v=M_4iBLZ79Xc"

          # Shanghai Major 2024: official PGL highlight package + raw winning moment for the emotional drop.
          ytdl_section "04_shanghai24_pgl_highlights" "https://www.youtube.com/watch?v=LvcfSP2PUPI" "*00:00:00-00:08:00"
          ytdl_whole "05_shanghai24_winning_moment" "https://www.youtube.com/watch?v=Ovci_VU4Kb0"

          # Normalize whatever succeeded to stable 720p30 H.264 clips.
          for f in out/raw/*; do
            [ -f "$f" ] || continue
            base="$(basename "${f%.*}")"
            ffmpeg -y -loglevel warning -i "$f" \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30" \
              -c:v libx264 -preset fast -crf 20 -c:a aac -b:a 128k -movflags +faststart \
              "out/final/${base}.mp4" || true
          done

          find out/final -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee out/files.txt
          : > out/ffprobe.tsv
          for f in out/final/*.mp4; do
            [ -f "$f" ] || continue
            printf '%s\t' "$(basename "$f")" >> out/ffprobe.tsv
            ffprobe -v error -show_entries format=duration,size -of default=nw=1:nk=1 "$f" | tr '\n' '\t' >> out/ffprobe.tsv
            printf '\n' >> out/ffprobe.tsv
          done
          cat out/files.txt
          cat out/ffprobe.tsv

      - name: Upload footage artifact
        uses: actions/upload-artifact@v4
        with:
          name: broky-v2-youtube-footage
          path: out
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
