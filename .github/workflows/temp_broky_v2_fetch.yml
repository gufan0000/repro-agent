name: Temporary broky V2 footage fetch

on:
  pull_request:
    branches: [main]
    paths:
      - 'temp/broky_v2_trigger.txt'

permissions:
  contents: read

jobs:
  inspect-bilibili-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public Bilibili metadata and play URLs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          python -m pip install -q requests
          cat > /tmp/inspect.py <<'PY'
          import json, requests
          from pathlib import Path
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'
          S=requests.Session(); S.headers.update({'User-Agent':UA})
          jobs=[
            ('early','BV1Zr4y1w77S',1),
            ('deagle1v4','BV1uz4y1t76k',1),
            ('ace1v4_2022','BV1ye411g7vo',1),
            ('chengdu','BV1HC411V7Zm',1),
            ('tec9_2025','BV1rkWqzQEai',1),
            ('antwerp','BV1rcSWYPEhX',2),
            ('shanghai','BV1NeqoYqECx',3),
          ]
          out=[]
          for name,bvid,page in jobs:
            item={'name':name,'bvid':bvid,'page':page}
            try:
              ref=f'https://www.bilibili.com/video/{bvid}/'
              h={'User-Agent':UA,'Referer':ref,'Origin':'https://www.bilibili.com'}
              r=S.get('https://api.bilibili.com/x/web-interface/view',params={'bvid':bvid},headers=h,timeout=20)
              item['view_http']=r.status_code
              j=r.json(); item['view_code']=j.get('code')
              if j.get('code')!=0: item['view_msg']=j; out.append(item); continue
              d=j['data']; p=d['pages'][page-1]
              item.update({'title':d.get('title'),'aid':d.get('aid'),'cid':p['cid'],'part':p.get('part'),'duration':p.get('duration'),'pages':len(d['pages'])})
              pr=S.get('https://api.bilibili.com/x/player/playurl',params={'bvid':bvid,'cid':p['cid'],'qn':64,'fnval':0,'fnver':0,'fourk':0,'platform':'html5'},headers=h,timeout=20)
              item['play_http']=pr.status_code
              pj=pr.json(); item['play_code']=pj.get('code')
              pd=pj.get('data') or {}; item['quality']=pd.get('quality'); item['format']=pd.get('format')
              ds=pd.get('durl') or []
              item['durl_count']=len(ds)
              if ds:
                du=ds[0]; item.update({'durl_size':du.get('size'),'durl_length_ms':du.get('length'),'url_prefix':du.get('url','')[:180]})
                try:
                  hr=S.head(du['url'],headers=h,timeout=20,allow_redirects=True)
                  item['head_http']=hr.status_code; item['head_len']=hr.headers.get('content-length'); item['accept_ranges']=hr.headers.get('accept-ranges'); item['final_host']=hr.url.split('/')[2]
                except Exception as e: item['head_error']=repr(e)
            except Exception as e: item['error']=repr(e)
            out.append(item)
          Path('out/report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          python /tmp/inspect.py
      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: broky-v2-bilibili-metadata
          path: out
          retention-days: 2
          if-no-files-found: error
