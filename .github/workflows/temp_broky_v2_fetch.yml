name: Temporary broky V2 footage fetch

on:
  pull_request:
    branches: [main]
    paths:
      - 'temp/broky_v2_trigger.txt'

permissions:
  contents: read

jobs:
  inspect-hltv-highlight-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch raw HLTV event pages and inspect highlight metadata
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'
          curl -fL --compressed -A "$UA" 'https://www.hltv.org/events/6136/iem-katowice-2022' -o out/kato.html
          curl -fL --compressed -A "$UA" 'https://www.hltv.org/events/7437/iem-chengdu-2024' -o out/chengdu.html
          curl -fL --compressed -A "$UA" 'https://www.hltv.org/events/7524/perfect-world-shanghai-major-2024' -o out/shanghai.html
          python - <<'PY'
          from pathlib import Path
          uuids = {
            'kato.html': ['3b500603-4ce7-4539-9dad-2d5dfbafe9d7','26874f17-703f-446a-af95-33f9f789bca4','f0c34822-d0c8-45bf-a587-fa115eb486fd'],
            'chengdu.html': ['b602096a-372e-4b2c-bc54-5e3dc2df73b6','aaae198a-09e2-4906-8b70-3e45f5555649','36184316-3258-43a0-b9ba-a436c465dce5'],
            'shanghai.html': ['453b468a-36c4-4016-894d-8b154b9ac1ec','7690329c-8c57-46fc-bfac-ccedfbed0c34','14c15d61-051e-42fd-a177-8b968c9c22e0'],
          }
          out = Path('out')
          summary=[]
          for fn, ids in uuids.items():
            text=(out/fn).read_text(errors='replace')
            summary.append(f'===== {fn} size={len(text)} =====')
            for uid in ids:
              p=text.find(uid)
              summary.append(f'\n--- {uid} pos={p} ---')
              if p>=0:
                snippet=text[max(0,p-3500):p+3500]
                (out/f'{fn}.{uid}.snippet.html').write_text(snippet)
                summary.append(snippet)
          (out/'snippets.txt').write_text('\n'.join(summary))
          PY
          grep -rhoE 'https?://[^"'"'<> ]+' out/*.html | grep -Ei 'twitch|jtvnw|cloudfront' | sort -u > out/media_urls.txt || true
          grep -rhoE '(clips\.twitch\.tv|twitch\.tv)/[^"'"'<> ]+' out/*.html | sort -u > out/twitch_refs.txt || true
          wc -c out/* | tee out/files.txt
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: broky-v2-hltv-metadata
          path: out
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
