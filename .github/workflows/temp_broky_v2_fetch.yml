name: Temporary broky V2 footage fetch

on:
  pull_request:
    branches: [main]
    paths:
      - 'temp/broky_v2_trigger.txt'

permissions:
  contents: read

jobs:
  fetch-finals-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install -q requests
      - name: Fetch first 18 MiB from verified finals maps
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cat > /tmp/fetch_head.py <<'PY'
          import json
          from pathlib import Path
          import requests
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'
          S=requests.Session(); S.headers.update({'User-Agent':UA})
          jobs=[
            ('antwerp_final_open','BV1rcSWYPEhX',2),
            ('shanghai_final_open','BV1NeqoYqECx',3),
          ]
          limit=18*1024*1024
          report=[]
          for name,bvid,page in jobs:
            item={'name':name,'bvid':bvid,'page':page}
            try:
              ref=f'https://www.bilibili.com/video/{bvid}/'; h={'User-Agent':UA,'Referer':ref,'Origin':'https://www.bilibili.com'}
              j=S.get('https://api.bilibili.com/x/web-interface/view',params={'bvid':bvid},headers=h,timeout=30).json(); assert j.get('code')==0,j
              d=j['data']; p=d['pages'][page-1]
              pj=S.get('https://api.bilibili.com/x/player/playurl',params={'bvid':bvid,'cid':p['cid'],'qn':64,'fnval':0,'fnver':0,'fourk':0,'platform':'html5'},headers=h,timeout=30).json(); assert pj.get('code')==0,pj
              du=pj['data']['durl'][0]; url=du['url']
              item.update({'title':d.get('title'),'part':p.get('part'),'source_duration':p.get('duration'),'source_bytes':du.get('size')})
              dest=Path('out')/f'{name}.mp4'; got=0
              with S.get(url,headers=h,stream=True,timeout=180) as r:
                r.raise_for_status()
                with dest.open('wb') as f:
                  for c in r.iter_content(1024*1024):
                    if not c: continue
                    remain=limit-got
                    if remain<=0: break
                    if len(c)>remain: c=c[:remain]
                    f.write(c); got+=len(c)
                    if got>=limit: break
              item['saved_bytes']=got
            except Exception as e: item['error']=repr(e)
            report.append(item)
          Path('out/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/fetch_head.py
          find out -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort
      - name: Upload opening footage
        uses: actions/upload-artifact@v4
        with:
          name: broky-v2-finals-opening
          path: out
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
