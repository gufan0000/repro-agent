name: Temporary broky V2 footage fetch

on:
  pull_request:
    branches: [main]
    paths:
      - 'temp/broky_v2_trigger.txt'

permissions:
  contents: read

jobs:
  fetch-official-youtube-footage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade 'yt-dlp[default,curl-cffi]'
      - name: Download official footage excerpts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          : > out/download.log
          grab_section() {
            name="$1"; url="$2"; section="$3"
            echo "===== $name :: $url :: $section =====" | tee -a out/download.log
            yt-dlp --no-warnings --impersonate chrome \
              --format 'bv*[height<=720]+ba/b[height<=720]/b' \
              --merge-output-format mp4 --force-keyframes-at-cuts \
              --download-sections "$section" \
              --output "out/${name}.%(ext)s" "$url" 2>&1 | tee -a out/download.log || true
          }
          grab_full() {
            name="$1"; url="$2"
            echo "===== $name :: $url =====" | tee -a out/download.log
            yt-dlp --no-warnings --impersonate chrome \
              --format 'bv*[height<=720]+ba/b[height<=720]/b' \
              --merge-output-format mp4 \
              --output "out/${name}.%(ext)s" "$url" 2>&1 | tee -a out/download.log || true
          }

          # ESL Archives: official IEM Katowice 2022 grand final map VODs.
          # Map 2 chapter marks broky's 1v2 at 01:50:18.
          grab_section 01_kato22_broky_1v2 'https://www.youtube.com/watch?v=SQnw7Z1YOn4' '*01:49:30-01:52:10'
          # Map 3: the 13-13 breaker sits around round 27, starting 00:49:13.
          grab_section 02_kato22_broky_4awp 'https://www.youtube.com/watch?v=jUe-NSgmAgQ' '*00:48:45-00:51:20'

          # ESL Counter-Strike Extra: dedicated official broky Chengdu MVP montage.
          grab_full 03_chengdu24_broky_mvp 'https://www.youtube.com/watch?v=M_4iBLZ79Xc'

          # PGL Counter-Strike Highlights: official Shanghai Major grand final highlights.
          grab_full 04_shanghai24_grand_final 'https://www.youtube.com/watch?v=LvcfSP2PUPI'

          find out -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee out/files.txt
          : > out/ffprobe.tsv
          for f in out/*.mp4 out/*.webm out/*.mkv; do
            [ -f "$f" ] || continue
            printf '%s\t' "$(basename "$f")" >> out/ffprobe.tsv
            ffprobe -v error -show_entries format=duration,size -of default=nw=1:nk=1 "$f" | tr '\n' '\t' >> out/ffprobe.tsv || true
            printf '\n' >> out/ffprobe.tsv
          done
      - name: Upload footage artifact
        uses: actions/upload-artifact@v4
        with:
          name: broky-v2-official-footage
          path: out
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
