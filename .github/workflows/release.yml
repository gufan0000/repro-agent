name: Release

# Publishing is driven by tags, and authenticated with npm trusted publishing (OIDC).
# There is no npm token in this repository and none in GitHub secrets: the runner mints a
# short-lived, workflow-scoped credential that cannot be extracted or replayed. It also
# gets npm provenance for free, so the registry can attest which commit produced the
# tarball.
#
# One-time setup on npmjs.com (package settings -> Trusted publisher):
#   Publisher: GitHub Actions · Repository: gufan0000/repro-agent · Workflow: release.yml

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token npm exchanges for publish rights
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+; the npm bundled with Node 22 is older.
      - run: npm install -g npm@latest

      - run: npm ci

      # When a publish fails, the two things you need to know first are whether npm is new
      # enough to do OIDC at all, and whether the runner was actually granted an identity
      # token. Neither is visible in the failure output, so state both up front.
      - name: Report publish preconditions
        run: |
          echo "npm $(npm --version)  (trusted publishing needs >= 11.5.1)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC identity token: available"
          else
            echo "OIDC identity token: NOT available — the job lacks id-token: write"
          fi

      - name: Refuse to publish a tag that disagrees with package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      - run: npm test

      # Re-running a release, or tagging a version that was published by hand, should be a
      # no-op rather than a red X. Only genuine publish failures should fail this job.
      - name: Skip if this version is already on the registry
        id: check
        run: |
          pkg="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$pkg is already published — nothing to do"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.already-published == 'false'
        run: npm publish --access public

  assets:
    # Every tag needs the file an ordinary user is told to download. Until now only v0.1.0
    # carried one, so anyone following the README got a page several versions out of date.
    name: attach the user download to the release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Assemble the download
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out/pack
          cp web/index.html "out/repro-agent-support.html"
          cp web/index.html "out/pack/Start diagnosis.html"
          cat > "out/pack/README.txt" <<'TXT'
          Repro Agent — offline diagnostic page
          =====================================
          Open "Start diagnosis.html" by double-clicking it. It runs entirely inside your
          browser: it never connects to the internet and nothing you type leaves this
          computer.

          Describe what went wrong, download the .md file it produces, then drag that file
          into your AI assistant and send: start

          Source and issues: https://github.com/gufan0000/repro-agent

          离线诊断页
          =========
          双击打开「Start diagnosis.html」。它完全在你的浏览器里运行，从不联网，你填写的
          任何内容都不会离开这台电脑。

          描述一下出了什么问题，下载它生成的 .md 文件，把那个文件拖进你的 AI 助手，
          然后发送：开始
          TXT
          (cd out/pack && zip -q -r "../repro-agent-user-${version}.zip" .)
          (cd out && sha256sum repro-agent-support.html "repro-agent-user-${version}.zip" > SHA256SUMS.txt)
          ls -l out

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "out/repro-agent-support.html" \
            "out/repro-agent-user-${version}.zip" \
            "out/SHA256SUMS.txt" --clobber
